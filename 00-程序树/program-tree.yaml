  name: 程序树
  kind: root
  layer: 0
  parent: null
  phase: P0
  status: 已完成
  responsibility: 接收公开仓库根→界定程序树工具自身的程序、契约、说明与四棵树实例边界→输出 6 个部门可独立验收的架构树
  not_responsible:
