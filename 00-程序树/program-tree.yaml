schema_version: 1
tree_version: 1.0.0
updated: '2026-11-07'
root: ptree
conventions:
  program_root: 10-程序
  spec_filename: SPEC.md
  manifest_filename: program.yaml
  contracts_file: 00-程序树/契约/contracts.yaml
  auto_commit: false
phases:
- id: P0
  name: 内核与规则
  goal: 树能读写、能校验、能回滚：清单解析、节点读写、R01-R46 规则、备份与运维
  exit_criteria:
  - 命令：ptree-cs --root . validate 退出码 0
  - 规则覆盖 R01-R46 与 T01-T12
- id: P1
  name: 接口层
  goal: AI 只调工具不读文件：MCP 26 个 tree_* 工具、CLI 子命令、HTTP 服务共用同一内核
  exit_criteria:
  - tools/list 返回全部 tree_* 工具
  - CLI 与 MCP 调用同一内核实现
- id: P2
  name: 画布
  goal: 只读画布把树、网格与联系画出来，数据由脚本从树清单导出
  exit_criteria:
  - viewer 能渲染示例树
  - grid_export.py 能为示例树生成 data.js
- id: P3
  name: 质量与发布
  goal: 测试与快照守门，构建与示例骨架可复现，开源物齐全
  exit_criteria:
  - 命令：dotnet test PTree.sln 全绿
  - examples/demo 上 validate 与 check 退出码 0
nodes:
