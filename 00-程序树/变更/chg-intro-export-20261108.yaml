ops:
  - op: intro
    node: canvas.grid-export
    text: "网格导出器是快照的唯一生成者，代码在 00-程序树/工具/适配/grid_export.py。它用 yaml 读 00-程序树/program-tree.yaml，按清单的 trees 段与内置四棵树默认值把程序、策划、美术、UI 与预留网格逐张解析；parse_rows 从 树实例 的每行字段顺序取列，read_short 读 00-程序树/短介绍 把短介绍压成一行；graph_for_program 与 build_row_graph 把节点按 parent 建树并补合成的视图根；联系分五类：包含边来自 parent，依赖边来自节点依赖，契约流按 outputs 与 inputs 连产出方到消费方，策划边把策划条目连到对应程序，功能块边把 groups 成员连进画布；最后序列化成 window.GRID_DATA 写入 00-程序树/工具/viewer/data.js。边界是不渲染、不改清单与树实例。已知缺口是产物为快照，实时写操作后不自动重导；bridge.html 已于 2026-11-08 补上，file:// 加 ?api= 的连接方式可用。"
